name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      LLM__GROQ_API_KEY: "dummy-test-key"
      LLM__GEMINI_API_KEY: "dummy-test-key"
      DATABASE__URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      MCP__SERVER_URL: "http://localhost:8000/mcp"
      MCP__AUTH_TOKEN: "dummy-test-token"
      SECURITY__BEARER_TOKEN: "dummy-test-token"
      MONITORING__LANGSMITH_API_KEY: "dummy-test-key"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests/ -v