version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: investor-intel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: investor-intel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: investor-intel-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - VECTORDB__HOST=qdrant
      - REDIS__HOST=redis
    volumes:
      - ../data:/app/data
      - ~/.investor_intelligence_mcp_tokens:/root/.investor_intelligence_mcp_tokens
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: investor-intel-frontend
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      - VECTORDB__HOST=qdrant
      - REDIS__HOST=redis
      - API_BASE_URL=http://api:8000
    volumes:
      - ../data:/app/data
    depends_on:
      - api
    restart: unless-stopped
    command: ["uv", "run", "streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0"]
  
  mcp-server:
    build:
      context: ../../financial-data-mcp-server
      dockerfile: Dockerfile
    container_name: investor-intel-mcp-server
    ports:
      - "8001:8000"
    environment:
      - MCP_AUTH_TOKEN=g9ZJiJrd_QcKx8BoA9vMg4b89BLK-1CGjqCxakyp7Yo
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data: